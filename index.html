<body class="bg-slate-950 text-slate-100 antialiased h-screen w-screen overflow-hidden">

  <script type="text/babel">
    const { useState, useEffect } = React;

    // AUDIO FEEDBACK SYNTHESIZER
    const playSound = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;

        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'wish') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
          });
        }
      } catch (e) {
        console.warn('Audio feedback error', e);
      }
    };

    // MAIN APP COMPONENT
    function App() {
      const totalSlides = 8;
      const [currentSlide, setCurrentSlide] = useState(0);

      // Interactive discussion states
      const [selectedTab, setSelectedTab] = useState(0);
      const [activeValue, setActiveValue] = useState(null);
      const [unlockedChallenges, setUnlockedChallenges] = useState({});
      
      // Wish Board state
      const [wishes, setWishes] = useState([
        { id: 1, text: "Дякуємо за кожен тихий світанок і можливість навчатися!", author: "8-А клас" },
        { id: 2, text: "Повертайтеся неушкодженими з Перемогою!", author: "Учні 8-го класу" },
        { id: 3, text: "Ваша мужність надихає нас бути сильними та згуртованими!", author: "Шкільна родина" }
      ]);
      const [customWish, setCustomWish] = useState("");
      const [authorName, setAuthorName] = useState("");
      const [showSparkles, setShowSparkles] = useState(false);

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowRight" || e.key === "PageDown") {
            nextSlide();
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            prevSlide();
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [currentSlide]);

      const nextSlide = () => {
        if (currentSlide < totalSlides - 1) {
          playSound('click');
          setCurrentSlide(prev => prev + 1);
        }
      };

      const prevSlide = () => {
        if (currentSlide > 0) {
          playSound('click');
          setCurrentSlide(prev => prev - 1);
        }
      };

      const addWish = (textToAdd, authorToAdd) => {
        const text = textToAdd || customWish;
        const author = authorToAdd || authorName || "Учень 8 класу";
        if (!text.trim()) return;

        playSound('wish');
        setWishes(prev => [...prev, { id: Date.now(), text, author }]);
        if (!textToAdd) {
          setCustomWish("");
        }
        setShowSparkles(true);
        setTimeout(() => setShowSparkles(false), 2000);
      };

      const renderSlide = () => {
        switch (currentSlide) {

                <div className="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-blue-900/60 border border-amber-400/40 text-amber-300 font-bold text-base md:text-xl mb-6 shadow-lg animate-float">

                  <span>Виховна година для 8 класу</span>
                </div>

                <h1 className="text-3xl sm:text-5xl lg:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 tracking-tight leading-tight max-w-5xl mb-6 drop-shadow-md">
                  Сучасний щит України: <br/>
                  <span className="text-white font-extrabold">історія, цінності, виклики</span>
                </h1>

                <p className="text-slate-300 text-lg sm:text-2xl font-medium max-w-3xl mb-10 leading-relaxed">
                  Присвячено Дню захисників і захисниць України — людям, які тримають наше небо та виборюють вільне майбутнє.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-4xl">
                  <div className="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-5 text-center backdrop-blur shadow-md">
                    <i className="fa-solid fa-monument text-amber-400 text-3xl mb-2"></i>
                    <h3 className="font-bold text-xl text-amber-200">Спадкоємність</h3>
                    <p className="text-slate-400 text-sm mt-1">Від козацької слави до ЗСУ</p>
                  </div>
                  <div className="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-5 text-center backdrop-blur shadow-md">

                      </p>

                    {/* Interactive Discussion Prompt Box */}

                <div className="text-center mb-2">

                  </span>

                  </h2>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center flex-1 my-auto">
                  {/* Photo 2: Modern Ukrainian Defender */}
                  <div className="lg:col-span-5 h-full max-h-[48vh] lg:max-h-[60vh] relative rounded-2xl overflow-hidden border-2 border-blue-400/40 shadow-2xl group">
                    <img 
                      src="https://i.postimg.cc/pd85DQ7X/Gemini-Generated-Image-2uoon82uoon82uoo-(2).jpg"

                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                    <div className="absolute bottom-3 left-3 right-3 bg-slate-900/85 backdrop-blur-md p-3 rounded-xl border border-slate-700">
                      <p className="text-blue-300 font-bold text-sm sm:text-base">
                        «Наші захисники та захисниці — це технологічний, сміливий та незламний щит держави»
                      </p>
                    </div>
                  </div>

                  {/* Discussion & Challenge Topics */}
                  <div className="lg:col-span-7 flex flex-col justify-center space-y-3">
                    <div className="bg-slate-900/90 border border-slate-700 p-4 rounded-2xl shadow-md">
                      <h3 className="text-lg font-bold text-amber-300 mb-2 flex items-center gap-2">
                        <i className="fa-solid fa-[#5865F2] fa-laptop-code"></i> Челендж 1: Технологічна та високоточна війна

                      <p className="text-slate-300 text-sm sm:text-base">

                      </p>

                    <div className="bg-slate-900/90 border border-slate-700 p-4 rounded-2xl shadow-md">
                      <h3 className="text-lg font-bold text-blue-300 mb-2 flex items-center gap-2">
                        <i className="fa-solid fa-brain"></i> Челендж 2: Морально-психологічна витривалість

                    {/* Interactive Discussion Prompt */}
                    <div className="bg-gradient-to-r from-blue-950/60 to-slate-900/90 border border-blue-400/50 p-4 rounded-2xl">

                      </p>
                      <p className="text-slate-100 text-sm sm:text-base font-medium">
                        «Як ви вважаєте, що допомагає українським воїнам зберігати людяність, добрий гумор та оптимізм навіть у найважчих бойових умовах?»
                      </p>
                    </div>

                </div>
              </div>
            );

          // ==================== SLIDE 4: VALUES INTERACTIVE ====================

            const values = [
              {
                id: 'volya',
                title: 'Воля та Свобода',
                icon: 'fa-dove',
                color: 'from-amber-500 to-yellow-600',
                desc: 'Непереборне прагнення жити у вільній країні без чужого диктату та гніту.'

              {

              },
              {

              {

            return (
